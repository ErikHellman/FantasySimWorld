<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A: a cottage on one hex tile of the village grid -->
  <rect width="64" height="64" rx="14" fill="#10162c"/>
  <circle cx="51" cy="14" r="5.5" fill="#f2c14e"/>
  <!-- hex tile: top face and two visible sides -->
  <polygon points="13,43.5 32,49 32,56 13,50.5" fill="#4f8a35"/>
  <polygon points="32,49 51,43.5 51,50.5 32,56" fill="#3f7229"/>
  <polygon points="32,27 51,32.5 51,43.5 32,49 13,43.5 13,32.5" fill="#8ccf5e"/>
  <!-- cottage -->
  <rect x="37" y="15" width="4" height="8" fill="#f1ede4"/>
  <rect x="23" y="24" width="18" height="15" fill="#f1ede4"/>
  <polygon points="19,25 32,12 45,25" fill="#e0604f"/>
  <rect x="29" y="30" width="6" height="9" rx="1" fill="#10162c"/>
</svg>
