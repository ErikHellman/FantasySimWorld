[package]
name = "fsw-brain"
description = "The language-model brain: queue, governor, prompts, validation (port of src/brain)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fsw-core.workspace = true
fsw-world.workspace = true
fsw-sim.workspace = true
parking_lot = "0.12"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7.19"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
