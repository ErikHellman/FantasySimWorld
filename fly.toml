# Fly.io: one machine that runs the shared world around the clock. See docs/deploy.md.
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly volumes create data --size 3 --region <region>
#   fly secrets set AUTH_TOKEN=$(openssl rand -hex 24) PUBLIC_ORIGIN=https://<your-app>.fly.dev
#   fly storage create          # optional: Litestream backups (sets BUCKET_NAME and the AWS_* secrets)
#   fly deploy
app = "fantasy-sim-world"
primary_region = "arn"
kill_signal = "SIGTERM"
# The server's shutdown snapshot and Litestream's last sync fit well inside this.
kill_timeout = 30

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
DATA_DIR = "/data"
# How many people may watch at once; the rest wait in line. 0 for no cap.
MAX_VIEWERS = "150"
# Fly's proxy sets Fly-Client-IP; the sign-in rate limit keys on it.
TRUST_PROXY = "true"
LOG_FORMAT = "json"

# The SQLite database (world.db, its WAL and backup/latest.db). One volume means one machine.
[mounts]
source = "data"
destination = "/data"
initial_size = "3gb"

[http_service]
internal_port = 8080
force_https = true
# One shared world that runs around the clock: never stop the machine.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
# Each viewer holds one long-lived stream; count connections, not requests.
type = "connections"
soft_limit = 200
hard_limit = 250

[[http_service.checks]]
grace_period = "20s"
interval = "15s"
method = "GET"
path = "/healthz"
timeout = "2s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
