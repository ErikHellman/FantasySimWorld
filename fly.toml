# Fly.io, phase 0: proves the event stream behind Fly's proxy.
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly secrets set AUTH_TOKEN=$(openssl rand -hex 24) PUBLIC_ORIGIN=https://<your-app>.fly.dev
#   fly deploy
#   AUTH_TOKEN=… node tools/sse-probe.mjs https://<your-app>.fly.dev 120
# Phase 3 adds the /data volume; phase 6 finishes this file.
app = "fantasy-sim-world"
primary_region = "arn"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
# Fly's proxy sets Fly-Client-IP; the sign-in rate limit keys on it.
TRUST_PROXY = "true"

[http_service]
internal_port = 8080
force_https = true
# One shared world that runs around the clock: never stop the machine.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
path = "/healthz"
timeout = "2s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
